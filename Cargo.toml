[workspace]
members = [
  "crates/bridge",
  "crates/companion",
  "crates/diagnostics",
  "crates/discovery",
  "crates/receiver-trust",
  "crates/fcast-client",
  "crates/fcompanion",
  "crates/manifest-rewriter",
  "crates/media-fetcher",
  "crates/mock-receiver",
]
resolver = "2"

[package]
name = "fcast-web-sender"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
publish = false

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/caniko/fcast-web-sender"
rust-version = "1.89"
description = "Privacy-preserving browser sender for FCast receivers"

[dev-dependencies]
fcast-bridge = { path = "crates/bridge" }
serde_json.workspace = true

[workspace.dependencies]
base64 = "0.22"
hex = "0.4"
http = "1.3"
percent-encoding = "2.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
url = "2.5"
