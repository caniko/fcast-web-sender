[package]
name = "fcast-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "fcast-companion"
path = "src/main.rs"

[dependencies]
fcast-bridge = { path = "../bridge" }
fcast-client = { path = "../fcast-client", features = ["upstream"] }
fcast-diagnostics = { path = "../diagnostics" }
fcast-discovery = { path = "../discovery" }
fcast-media-fetcher = { path = "../media-fetcher" }
fcast-receiver-trust = { path = "../receiver-trust" }
serde_json.workspace = true
tokio.workspace = true
hex.workspace = true
rand.workspace = true
url.workspace = true

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/fcast-companion-{ version }-x86_64-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/fcast-companion-{ version }-x86_64-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
