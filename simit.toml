[flake]
scope = "hooks-only"

[prebuild]
release_archives = true
publish_attic = true

[ci]
provider = "actions"
platform = "github"
runtime = "nix"
nix_builds = [".#fcast-companion-x86_64-linux-musl"]
workspace = true
workspace_strategy = "aggregate"

[ci.nix_system_runners]
"x86_64-linux" = "ubuntu-24.04"

[release.github]
repo = "caniko/fcast-web-sender"
target_branch = "trunk"

[release.artifacts]
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
prebuild_binaries = true
version_attr = "fcast-companion-x86_64-linux-musl"
checksum_globs = ["*.tar.gz", "*.zip"]
sign = false

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "fcast-web-sender"
token_secret = "ATTIC_TOKEN"

[release.smoke]
command = "nix run .#release-smoke --"
